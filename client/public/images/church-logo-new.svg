<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- FGAG Church Emblem - Full Color for Light Backgrounds -->
  <defs>
    <linearGradient id="crossGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072a44"/>
      <stop offset="50%" stop-color="#0a3d62"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a1db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d4ac0d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a3d62" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Ring with Garden Theme -->
  <circle cx="60" cy="60" r="54" stroke="url(#blueAccent)" stroke-width="2.5" stroke-dasharray="1000" opacity="0.9" />
  <circle cx="60" cy="60" r="50" stroke="url(#goldAccent)" stroke-width="1" stroke-opacity="0.7" />

  <!-- Radiance / Glory Rays behind Cross -->
  <g opacity="0.35" stroke="url(#goldAccent)" stroke-width="1.5" stroke-linecap="round">
    <line x1="60" y1="20" x2="60" y2="14"/>
    <line x1="60" y1="100" x2="60" y2="106"/>
    <line x1="20" y1="60" x2="14" y2="60"/>
    <line x1="100" y1="60" x2="106" y2="60"/>
    <line x1="32" y1="32" x2="26" y2="26"/>
    <line x1="88" y1="32" x2="94" y2="26"/>
    <line x1="32" y1="88" x2="26" y2="94"/>
    <line x1="88" y1="88" x2="94" y2="94"/>
  </g>

  <!-- Holy Spirit Dove (Ascending/Descending at Top) -->
  <g fill="url(#goldAccent)" transform="translate(60, 26) scale(0.95)">
    <!-- Dove Body & Wings -->
    <path d="M0 -7 C2 -5, 6 -3, 8 -7 C7 -2, 4 0, 0 2 C-4 0, -7 -2, -8 -7 C-6 -3, -2 -5, 0 -7 Z" />
    <path d="M0 2 C1 5, 2 8, 3 10 C0 9, -2 9, -3 10 C-2 8, -1 5, 0 2 Z" opacity="0.9" />
    <!-- Wing left -->
    <path d="M-1 -1 C-6 -4, -12 -5, -16 -1 C-12 1, -6 0, -1 -1 Z" />
    <!-- Wing right -->
    <path d="M1 -1 C6 -4, 12 -5, 16 -1 C12 1, 6 0,1 -1 Z" />
  </g>

  <!-- Latin Cross -->
  <g filter="url(#softShadow)">
    <!-- Vertical Beam -->
    <rect x="54" y="32" width="12" height="60" rx="3" fill="url(#crossGradDark)"/>
    <!-- Horizontal Beam -->
    <rect x="34" y="46" width="52" height="12" rx="3" fill="url(#crossGradDark)"/>
    <!-- Inner Cross Highlight Stripe -->
    <rect x="58.5" y="34" width="3" height="56" rx="1.5" fill="#38a1db" opacity="0.75"/>
    <rect x="36" y="50.5" width="48" height="3" rx="1.5" fill="#38a1db" opacity="0.75"/>
  </g>

  <!-- Garden Olive Branches (Leaves wrapping around bottom) -->
  <!-- Left Branch -->
  <g fill="url(#blueAccent)">
    <!-- Stem arc -->
    <path d="M22 66 C 24 84, 40 98, 56 101" stroke="url(#blueAccent)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Leaves -->
    <path d="M22 64 C20 60, 24 56, 28 60 C26 64, 23 65, 22 64 Z"/>
    <path d="M26 75 C21 73, 23 67, 29 70 C29 74, 27 76, 26 75 Z"/>
    <path d="M34 85 C29 85, 30 79, 36 81 C37 84, 35 86, 34 85 Z"/>
    <path d="M45 94 C40 96, 40 90, 46 91 C48 93, 47 95, 45 94 Z"/>
  </g>

  <!-- Right Branch (Mirrored) -->
  <g fill="url(#blueAccent)">
    <!-- Stem arc -->
    <path d="M98 66 C 96 84, 80 98, 64 101" stroke="url(#blueAccent)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Leaves -->
    <path d="M98 64 C100 60, 96 56, 92 60 C94 64, 97 65, 98 64 Z"/>
    <path d="M94 75 C99 73, 97 67, 91 70 C91 74, 93 76, 94 75 Z"/>
    <path d="M86 85 C91 85, 90 79, 84 81 C83 84, 85 86, 86 85 Z"/>
    <path d="M75 94 C80 96, 80 90, 74 91 C72 93, 73 95, 75 94 Z"/>
  </g>

  <!-- Bottom Accent Ribbon / Seed of Faith -->
  <circle cx="60" cy="101" r="3.5" fill="url(#goldAccent)"/>
</svg>
